<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Grid / Map lines overlay (subtle) -->
  <path d="M 0,128 L 512,128 M 0,256 L 512,256 M 0,384 L 512,384 M 128,0 L 128,512 M 256,0 L 256,512 M 384,0 L 384,512" 
        stroke="#334155" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- Stylized Route Line (Orange) -->
  <path d="M 100,400 Q 200,320 256,256 T 412,150" 
        stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" 
        filter="url(#glow)" />
  <circle cx="100" cy="400" r="14" fill="#f97316" />
  <circle cx="412" cy="150" r="14" fill="#f97316" />

  <!-- Outer Ring of Camera Lens on Pin -->
  <g transform="translate(256, 220)">
    <!-- Map Pin Shape -->
    <path d="M 0,110 C 60,50 80,10 80,-40 C 80,-90 35,-130 0,-130 C -35,-130 -80,-90 -80,-40 C -80,10 -60,50 0,110 Z" 
          fill="url(#pinGrad)" filter="url(#glow)" />
    
    <!-- Camera Lens Outer (Silver/Grey) -->
    <circle cx="0" cy="-40" r="45" fill="#f8fafc" />
    <!-- Camera Lens Inner (Dark) -->
    <circle cx="0" cy="-40" r="38" fill="#1e293b" />
    <!-- Lens Reflection -->
    <circle cx="-12" cy="-52" r="10" fill="#f8fafc" opacity="0.6" />
    <circle cx="15" cy="-25" r="5" fill="#f8fafc" opacity="0.3" />
    
    <!-- Camera Aperture lines (Subtle) -->
    <path d="M -25,-40 L -38,-40 M 25,-40 L 38,-40 M 0,-65 L 0,-78 M 0,-15 L 0,-2" 
          stroke="#475569" stroke-width="2" />
  </g>

  <!-- Pin Shadow -->
  <ellipse cx="256" cy="350" rx="40" ry="12" fill="#000000" opacity="0.4" />
</svg>
